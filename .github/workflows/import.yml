name: Import verified image
on:
  push:
    branches: [main]
    paths: [.github/workflows/import.yml]
permissions:
  contents: read
  packages: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          command -v skopeo >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq skopeo)
          printf '%s' "$GH_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          skopeo copy docker://ttl.sh/strata-vast-a20ec367-e566-40cf-b061-d8a70cac85c8@sha256:5dceab3c18439f25ff2fd92fbfe127e8db7f46c4c123f98c456bc1139b225c16 docker://ghcr.io/${{ github.repository }}:latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
