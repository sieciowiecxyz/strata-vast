name: Import verified image
on:
  push:
    branches: [main]
    paths: [.github/workflows/import.yml]
permissions:
  contents: read
  packages: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker pull ttl.sh/strata-vast-a20ec367-e566-40cf-b061-d8a70cac85c8@sha256:d0e926e8ea83662ef782c2fa52833a087dc68ad38b5387f6db8f2b9a8d7ec805
          docker tag ttl.sh/strata-vast-a20ec367-e566-40cf-b061-d8a70cac85c8@sha256:d0e926e8ea83662ef782c2fa52833a087dc68ad38b5387f6db8f2b9a8d7ec805 ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:latest
